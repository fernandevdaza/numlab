name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Tipos, compilación y pruebas
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar tipos y compilar
        run: pnpm build
      - name: Pruebas (TeX, gráficas y verificación numérica)
        run: pnpm test
