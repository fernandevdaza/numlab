<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NumLab: laboratorio interactivo de métodos numéricos con tablas de iteraciones, gráficas, desarrollo paso a paso y código Scilab." />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,500..650;1,6..72,500&display=swap"
    />
    <title>NumLab · Métodos Numéricos</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita el destello del tema equivocado).
      try {
        var d = localStorage.getItem('numlab:dark')
        var dark = d !== null ? JSON.parse(d) : !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>NumLab necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
